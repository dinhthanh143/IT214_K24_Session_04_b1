server:
  port: 8085

spring:
  application:
    name: pharmacy-service
  datasource:
    url: jdbc:mysql://localhost:3306/medicare_pharmacy_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
